name: iOS Xcode Build

# 由 iBuilder CLI（builder ios build）通过 workflow_dispatch 触发。
# 产物：123AV-unsigned.ipa（未签名，Sideloadly / AltStore 自签安装）
on:
  workflow_dispatch:
    inputs:
      scheme:
        description: "Xcode scheme"
        required: false
        default: "123AV"
        type: string
      build_mode:
        description: "Build mode (release/debug)"
        required: false
        default: "release"
        type: string
      configuration:
        description: "Build configuration"
        required: false
        default: "Release"
        type: string

# 同一次推送只保留最新一次构建，队列里排队中的旧任务会被自动取消
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 工具链版本
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 安装 XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen || brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate
          # 新版 xcodegen 会写 objectVersion = 77（Xcode 16 格式），
          # 旧版 Xcode 读不了，这里统一下降到 55（Xcode 13+ 都能读）
          /usr/bin/sed -i '' -E 's/objectVersion = [0-9]+;/objectVersion = 55;/g' 123AV.xcodeproj/project.pbxproj
          echo "--- pbxproj 头部 ---"
          head -5 123AV.xcodeproj/project.pbxproj
          echo "--- xcode 版本 ---"
          xcodebuild -version

      - name: 编译 App（未签名）
        env:
          SCHEME: ${{ github.event.inputs.scheme || '123AV' }}
          CONFIG: ${{ github.event.inputs.configuration || 'Release' }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project 123AV.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -derivedDataPath build \
            CONFIGURATION_BUILD_DIR="$PWD/build/Products" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: 打包 IPA
        run: |
          set -euo pipefail
          APP_DIR="build/Products/123AV.app"
          test -d "$APP_DIR"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP_DIR" out/Payload/
          # 顺带做一次 ad-hoc 签名，侧载工具重签时更省事
          codesign --force --sign - --timestamp=none out/Payload/123AV.app || true
          ( cd out && zip -qry ../123AV-unsigned.ipa Payload )
          ls -lh 123AV-unsigned.ipa
          unzip -l 123AV-unsigned.ipa | head -20

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 123AV-unsigned-ipa
          path: 123AV-unsigned.ipa
          if-no-files-found: error
