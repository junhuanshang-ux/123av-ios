name: build-ipa

# 把本目录（123AV-iOS）作为仓库根目录提交后，手动触发即可得到未签名 IPA。
# （日常出包请用 ios-xcode.yml / iBuilder；这条是备用：走 scripts/build-ipa.sh）
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 工具链
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version

      - name: 构建未签名 IPA
        run: |
          chmod +x scripts/build-ipa.sh
          ./scripts/build-ipa.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 123AV-unsigned-ipa
          path: |
            dist/*.ipa
            dist/*.app
          if-no-files-found: error
